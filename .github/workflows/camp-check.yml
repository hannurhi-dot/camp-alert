name: 생림오토캠핑장 빈자리 감시

on:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다. Public 저장소면 "*/5" 로 바꿔도 무료.
                             # (깃허브 사정에 따라 실제로는 몇 분 더 늦게 돌 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: camp-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 이전 실행의 알림 상태(중복 알림 방지)를 복원/저장
      - uses: actions/cache@v4
        with:
          path: camp_state.json
          key: camp-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            camp-state-

      - name: 빈자리 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
        run: python camp_check.py
